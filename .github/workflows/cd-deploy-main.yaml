name: CD deploy main

permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  deploy-main:
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - name: Skip dispatch outside upstream repository
        if: github.repository_owner != 'twentyhq'
        run: |
          echo "Skipping cross-repository dispatch outside twentyhq."
          echo "This is expected for forks and personal repositories."

      - name: Repository Dispatch
        if: github.repository_owner == 'twentyhq'
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.TWENTY_INFRA_TOKEN }}
          repository: twentyhq/twenty-infra
          event-type: auto-deploy-main
          client-payload: '{"github": ${{ toJson(github) }}}' # Passes the entire github context to the downstream workflow
